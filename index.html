<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<title>Voice Bounce</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Poppins:ital,wght@1,800&display=swap" rel="stylesheet">
<link rel="icon" href="assets/game/face1.svg">
<link rel="stylesheet" href="css/style.css?v=__BUILD__">
</head>
<body>
<div id="rotate"><b>Turn your phone upright</b><span>Voice Bounce plays in portrait</span></div>
<video id="cam" playsinline muted autoplay></video>
<video id="playback" playsinline loop></video>
<div id="stage">
  <canvas id="game"></canvas>

  <img class="ov" id="ov-panel" src="assets/ui/panel.svg?v=4" alt="">
  <img class="ov" id="ov-camera" src="assets/ui/camera.svg?v=4" alt="">
  <img class="ov" id="ov-rec" src="assets/ui/rec.svg?v=4" alt="">
  <img class="ov" id="ov-paused" src="assets/ui/paused.svg?v=4" alt="">
  <img class="ov" id="ov-feed" src="assets/ui/feed.svg?v=4" alt="">

  <svg id="recUI" viewBox="0 0 390 792">
    <text id="timer" x="195" y="547" text-anchor="middle">00:00</text>
    <path id="arc" fill="none" stroke="#FE2C55" stroke-linecap="round"></path>
  </svg>

  <div id="carousel"><div id="fxName"></div><div id="ring"></div></div>
  <div id="tabs"><span data-d="600">10m</span><span data-d="60">60s</span><span data-d="15">15s</span><span>PHOTO</span><span>TEXT</span></div>

  <svg id="editUI" viewBox="0 0 390 792">
    <g class="ic" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M32 29 L22.5 39 L32 49"/>
    </g>
    <rect x="102" y="17" width="186" height="43" rx="21.5" fill="rgba(70,70,70,.55)"/>
    <path d="M124 30.5v11.2a3.2 3.2 0 1 1-2-3V31.6l8-1.8v2.3z" fill="#fff"/>
    <text x="137" y="44" fill="#fff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="15">original sound</text>
    <rect x="249" y="29" width="1" height="19" fill="rgba(255,255,255,.35)"/>
    <path d="M262 33l10 10M272 33l-10 10" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
    <!-- 右侧工具栏 -->
    <g class="ic" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" transform="translate(350 0)">
      <path transform="translate(0 25)" d="M14 2.5l3.3 2.3 4-.3 1.3 3.8 3.4 2.1-1 3.9 1 3.9-3.4 2.1-1.3 3.8-4-.3L14 25.5l-3.3-2.3-4 .3-1.3-3.8-3.4-2.1 1-3.9-1-3.9 3.4-2.1 1.3-3.8 4 .3z"/>
      <path transform="translate(0 76)" d="M16 5l9.5 8.5L16 22v-4.6c-6.2 0-10.2 1.9-13.5 6 .9-7.3 5-11.8 13.5-12.6z"/>
      <rect x="4" y="121.5" width="20" height="1" fill="rgba(255,255,255,.4)" stroke="none"/>
      <g transform="translate(0 141)"><rect x="2.5" y="7" width="23" height="14" rx="3.5"/><path d="M7.5 11.3L6 14l1.5 2.7M20.5 11.3L22 14l-1.5 2.7" stroke-width="1.8"/></g>
      <g transform="translate(0 192)"><rect x="4.5" y="7" width="17" height="17" rx="3.5" transform="rotate(-12 13 15.5)"/><path d="M11 12.3l6 3.4-6 3.4z" fill="#fff" stroke-width="1.4"/><path d="M19.5 4.2l4.3 1.3-1.4 4.6" stroke-width="2"/></g>
      <text x="14" y="252" text-anchor="middle" fill="#fff" stroke="none" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="500" font-size="23" letter-spacing="-.5">Aa</text>
      <g transform="translate(0 295)"><path d="M8.5 3.5h11a5 5 0 0 1 5 5v7.5l-8.5 8.5H8.5a5 5 0 0 1-5-5v-11a5 5 0 0 1 5-5z"/><path d="M24.5 16h-4.5a4 4 0 0 0-4 4v4.5"/><path d="M10.5 10v2.5M16.5 10v2.5" stroke-width="2.4"/><path d="M9.5 17.2c2.3 1.6 5 1.6 7.2 0" stroke-width="2"/></g>
      <g transform="translate(0 347)"><circle cx="14" cy="9.5" r="6"/><circle cx="9.3" cy="17.6" r="6"/><circle cx="18.7" cy="17.6" r="6"/></g>
      <g transform="translate(0 397)"><path d="M19.5 9.5A7 7 0 1 0 21 16"/><path d="M14 23v4" /><path d="M10 27h8"/><path d="M14 9a3.5 3.5 0 0 0-3.5 3.5v2a3.5 3.5 0 0 0 7 0" stroke-width="2"/><path d="M22.5 1.5l1 2.5 2.5 1-2.5 1-1 2.5-1-2.5-2.5-1 2.5-1z" fill="#fff" stroke-width="1"/></g>
      <g transform="translate(0 449)"><rect x="2.5" y="6" width="23" height="16" rx="3.5"/><path d="M7 12.5h6M15.5 12.5H21M7 16.5h3M12.5 16.5H21" stroke-width="2"/></g>
    </g>
    <!-- AutoCut -->
    <g id="editBottom">
    <rect x="149" y="638" width="92" height="33" rx="12" fill="rgba(0,0,0,.25)"/>
    <path d="M163 646.5l1.6 4 4 1.6-4 1.6-1.6 4-1.6-4-4-1.6 4-1.6zM169.5 643l.7 1.6 1.6.7-1.6.7-.7 1.6-.7-1.6-1.6-.7 1.6-.7zM168.5 657l.6 1.3 1.3.6-1.3.6-.6 1.3-.6-1.3-1.3-.6 1.3-.6z" fill="#fff"/>
    <text x="175" y="660" fill="#fff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="500" font-size="15">AutoCut</text>
    </g>
  </svg>
  <button class="pill" id="storyBtn"><i></i>Your Story</button>
  <button class="pill" id="nextBtn">Next</button>

  <!-- 点击区域（透明，叠在设计稿按钮上） -->
  <button class="hp" data-s="panel"  data-a="record"  style="left:155px;top:692px;width:80px;height:80px"></button>
  <button class="hp" data-s="panel"  data-a="toCamera" style="left:0;top:64px;width:390px;height:370px;border-radius:0"></button>
  <button class="hp" data-s="camera" data-a="toPanel" style="left:6px;top:5px;width:44px;height:44px"></button>
  <button class="hp" data-s="rec"    data-a="stop"    style="left:140px;top:570px;width:110px;height:110px"></button>
  <button class="hp" data-s="rec"    data-a="finish"  style="left:322px;top:601px;width:48px;height:48px"></button>
  <button class="hp" data-s="paused" data-a="record"  style="left:145px;top:575px;width:100px;height:100px"></button>
  <button class="hp" data-s="paused" data-a="finish"  style="left:322px;top:601px;width:48px;height:48px"></button>
  <button class="hp" data-s="paused" data-a="discard" style="left:256px;top:603px;width:46px;height:44px"></button>
  <button class="hp" data-s="paused" data-a="toPanel" style="left:47px;top:595px;width:60px;height:60px;border-radius:12px"></button>
  <button class="hp" data-s="paused" data-a="discard" style="left:6px;top:12px;width:44px;height:44px"></button>
  <button class="hp" data-s="edit"   data-a="discard" style="left:4px;top:16px;width:50px;height:46px;border-radius:12px"></button>
  <button class="hp" data-s="feed"   data-a="toCamera" style="left:166px;top:712px;width:56px;height:44px;border-radius:10px"></button>
  <button class="hp" data-s="feed"   data-a="togglePlay" style="left:0;top:60px;width:330px;height:560px;border-radius:0"></button>
  <button id="retryBtn">Retry</button>

  <div id="err"></div>
</div>

<script src="js/game.js?v=__BUILD__"></script>
</body>
</html>
